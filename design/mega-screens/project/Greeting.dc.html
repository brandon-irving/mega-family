@keyframes meter{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

      <span class="bar" style="width: 5px; height: 10px; border-radius: 3px; background: #2FB8B0; animation-delay: 0s"></span>
      <span class="bar" style="width: 5px; height: 18px; border-radius: 3px; background: #2FB8B0; animation-delay: .1s"></span>
      <span class="bar" style="width: 5px; height: 26px; border-radius: 3px; background: #2FB8B0; animation-delay: .2s"></span>
      <span class="bar" style="width: 5px; height: 18px; border-radius: 3px; background: #2FB8B0; animation-delay: .3s"></span>
      <span class="bar" style="width: 5px; height: 10px; border-radius: 3px; background: #2FB8B0; animation-delay: .4s"></span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 0 32px">
      <div style="font-size: 28px; font-weight: 700">Good morning, Brandon!</div>
      <div style="font-size: 15px; color: #B4BAC3">Soccer pickup is at 4:50 today.</div>
    </div>
  </div>
</div>
