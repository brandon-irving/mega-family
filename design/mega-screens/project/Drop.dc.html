<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triggered reminder card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E11}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #EDEFF2">
  <dc-import name="Main" hint-size="390px,844px"></dc-import>
  <div style="position: absolute; inset: 0; background: rgba(8,9,12,0.45)"></div>
  <section aria-label="Reminder" style="position: absolute; top: 10px; left: 10px; right: 10px; background: #1B1F25; border: 1px solid #2E343D; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.55)">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 31px; border-radius: 8px; overflow: hidden; flex-shrink: 0"><img src="/_blob/4e65e4e0767e20ffbb714514eea3f8b4" alt="" style="width: 36px; height: 31px; display: block"></div>
      <div style="display: flex; flex-direction: column; gap: 1px; flex: 1">
        <div style="font-size: 12px; color: #9AA1AB">Teal · reminder</div>
        <div style="font-size: 17px; font-weight: 600">Soccer pickup in 10 minutes</div>
      </div>
      <button type="button" aria-label="Dismiss" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: transparent; color: #9AA1AB; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <div style="font-size: 14px; color: #B4BAC3; line-height: 20px">Practice ends at 5:30. Leave by 4:50 to beat traffic.</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 44px; border-radius: 22px; border: none; background: #2FB8B0; color: #04201E; font-size: 15px; font-weight: 600">I'm on my way</button>
      <button type="button" style="height: 44px; border-radius: 22px; border: 1px solid #2E343D; background: #16191E; color: #EDEFF2; font-size: 15px">Snooze 5 min</button>
    </div>
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #3A414B"></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
