const VIEWERS = {
  admin: { mega: 'Teal', hex: '#2FB8B0', face: 'open', sees: ['You', 'Twins', 'Family'] },
  kid: { mega: 'Zap', hex: '#8E6CE0', face: 'happy', sees: ['Twins', 'Family'], kid: true },
};
// What the MEGA would say next when nothing is coming up: the top-scored proactive statement
// that the judge didn't think was worth a push. Samples only.
const STATEMENTS = {
  admin: { text: 'Recycling goes out Tuesday. Want a reminder Monday night?', short: 'Recycling goes out Tuesday' },
  kid: { text: 'Reading time is done. Want to pick a book for tomorrow?', short: 'Pick a book for tomorrow?' },
};
const ICONS = ['#3A4150', '#4B3A50', '#2F4A45', '#50473A', '#3A4A5A', '#45503A', '#503A3F', '#3A3F50', '#4A4A4A', '#2F3A4A', '#4A3A2F'];

class Component extends DCLogic {
  renderVals() {
    const v = VIEWERS[this.props.who] ?? VIEWERS.admin, nowKey = this.props.now === 'evening' ? 'evening' : 'afternoon', now = NOW[nowKey];
    const { dark } = shades(v.hex), accent = v.hex;
    // Priority: anything in the next 2 hours, otherwise the MEGA's proactive statement.
    const soon = WEEK[0].events.filter(([t, , who]) => v.sees.includes(who) && t >= now && t - now <= SOON_WINDOW)
      .map(([t, title, who]) => ({ time: clock(t), until: inMinutes(t - now), title, who: who === 'You' && v.kid ? 'Family' : who, color: WHO[who] }));
    const statement = STATEMENTS[this.props.who] ?? STATEMENTS.admin, next = soon[0];
    const time = clock(now).replace(/ (AM|PM)$/, '');
    return {
      wallpaper: 'linear-gradient(165deg, ' + dark + ' 0%, #12151A 55%, #0C0E11 100%)',
      isHome: this.props.view !== 'lock', isLock: this.props.view === 'lock', time, mega: v.mega,
      accent, accentInk: inkOn(accent),
      head: sprite(v.hex, v.face, 'none', 1.5, 27), tinyHead: sprite(v.hex, v.face, 'none', 0.8125, 27),
      hasSoon: soon.length > 0, noSoon: soon.length === 0, soon: soon.slice(0, 3), statement,
      mediumTitle: soon.length ? 'Coming up · next 2 hours' : v.mega + ' says',
      mediumLabel: soon.length ? 'Coming up: ' + soon.map((e) => e.title + ' ' + e.until).join(', ') : v.mega + ' says: ' + statement.text,
      // Tapping a widget opens the chat; the Talk button opens talk mode already listening.
      tapHref: v.kid ? 'Kid.dc.html' : 'Main.dc.html',
      smallBg: accent, smallInk: inkOn(accent), smallFont: v.kid ? 19 : 17,
      smallTag: next ? next.until.replace('in ', '') : 'Tip',
      smallLine: next ? next.title : statement.short,
      inline: WEEK[0].dow + ' ' + WEEK[0].num + (next ? ' · ' + next.title + ' ' + next.time : ''),
      lockKicker: next ? next.time + ' · ' + next.until : v.mega + ' says',
      lockLine: next ? next.title : statement.short,
      iconsA: ICONS.slice(0, 4), iconsB: ICONS.slice(4, 7), dock: ICONS.slice(7, 11),
    };
  }
}
</script>
</body>
</html>
