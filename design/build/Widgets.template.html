<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E11}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #EDEFF2; background: {{wallpaper}}">

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; top: 16px; left: 34px; font-size: 16px; font-weight: 600">{{time}}</div>
    <div style="position: absolute; top: 62px; left: 18px; right: 18px; display: flex; flex-direction: column; gap: 26px">

      <div style="position: relative; height: 164px; border-radius: 24px; background: rgba(22,25,30,0.92); padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.35)">
        <a href="{{tapHref}}" aria-label="{{mediumLabel}}" style="position: absolute; inset: 0; z-index: 1; border-radius: 24px"></a>
        <div style="display: flex; align-items: center; gap: 8px; padding-right: 48px">
          <span style="position: relative; width: 26px; height: 22px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #FFFFFF">
            <sc-for list="{{tinyHead.rects}}" as="r" hint-placeholder-count="150">
              <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
            </sc-for>
          </span>
          <span style="font-size: 13px; font-weight: 700; color: {{accent}}">{{mediumTitle}}</span>
        </div>
        <sc-if value="{{hasSoon}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 7px">
            <sc-for list="{{soon}}" as="e" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 10px">
                <span aria-hidden="true" style="width: 4px; height: 34px; border-radius: 2px; background: {{e.color}}"></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                  <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.title}}</span>
                  <span style="font-size: 12px; color: #9AA1AB">{{e.time}} · {{e.who}}</span>
                </span>
                <span style="font-size: 13px; font-weight: 600; color: #EDEFF2">{{e.until}}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{noSoon}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 18px; font-weight: 600; line-height: 24px">{{statement.text}}</div>
          <div style="margin-top: auto; font-size: 12px; color: #9AA1AB">No events in the next 2 hours · Tap to reply</div>
        </sc-if>
        <a href="Talk.dc.html" aria-label="Talk to {{mega}}" style="position: absolute; z-index: 2; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 22px; background: {{accent}}; color: {{accentInk}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        </a>
      </div>

      <div style="display: flex; gap: 26px">
        <div style="position: relative; width: 164px; height: 164px; flex-shrink: 0; border-radius: 24px; background: {{smallBg}}; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.35)">
          <a href="{{tapHref}}" aria-label="{{mega}}: {{smallLine}}" style="position: absolute; inset: 0; z-index: 1; border-radius: 24px"></a>
          <div style="display: flex; align-items: flex-start; gap: 6px">
            <span style="position: relative; width: 48px; height: 41px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #FFFFFF">
              <sc-for list="{{head.rects}}" as="r" hint-placeholder-count="150">
                <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
              </sc-for>
            </span>
            <span style="font-size: 12px; font-weight: 700; color: #04201E; background: rgba(255,255,255,0.75); padding: 3px 7px; border-radius: 8px; margin-left: auto">{{smallTag}}</span>
          </div>
          <div style="font-size: {{smallFont}}px; font-weight: 700; line-height: 1.25; color: {{smallInk}}; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical">{{smallLine}}</div>
          <a href="Talk.dc.html" aria-label="Talk to {{mega}}" style="position: relative; z-index: 2; margin-top: auto; height: 34px; border-radius: 17px; background: rgba(12,14,17,0.85); color: #EDEFF2; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Talk
          </a>
        </div>
        <div aria-hidden="true" style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 22px 0; justify-items: center; align-content: start">
          <sc-for list="{{iconsA}}" as="i" hint-placeholder-count="4"><span style="width: 62px; height: 62px; border-radius: 15px; background: {{i}}"></span></sc-for>
        </div>
      </div>

      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, 1fr); justify-items: center">
        <span style="position: relative; width: 62px; height: 62px; border-radius: 15px; overflow: hidden; background: {{accent}}">
          <span style="position: absolute; left: 7px; top: 10px; width: 48px; height: 41px; border-radius: 9px; overflow: hidden; background: #FFFFFF">
            <sc-for list="{{head.rects}}" as="r" hint-placeholder-count="150">
              <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
            </sc-for>
          </span>
        </span>
        <sc-for list="{{iconsB}}" as="i" hint-placeholder-count="3"><span style="width: 62px; height: 62px; border-radius: 15px; background: {{i}}"></span></sc-for>
      </div>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 88px; border-radius: 30px; background: rgba(40,44,52,0.55); display: flex; align-items: center; justify-content: space-around">
      <sc-for list="{{dock}}" as="i" hint-placeholder-count="4"><span style="width: 62px; height: 62px; border-radius: 15px; background: {{i}}"></span></sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isLock}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 58px">
      <div style="font-size: 16px; font-weight: 600">{{inline}}</div>
      <div style="font-size: 86px; font-weight: 700; line-height: 92px; letter-spacing: -2px">{{time}}</div>
      <div style="display: flex; gap: 12px; margin-top: 6px">
        <a href="{{tapHref}}" aria-label="{{mediumLabel}}" style="width: 166px; height: 72px; border-radius: 16px; background: rgba(255,255,255,0.14); padding: 8px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 700; opacity: 0.8">{{lockKicker}}</span>
          <span style="font-size: 14px; font-weight: 600; line-height: 18px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{lockLine}}</span>
        </a>
        <a href="Talk.dc.html" aria-label="Talk to {{mega}}" style="width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
          <span style="font-size: 11px; font-weight: 700">Talk</span>
        </a>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 44px; right: 44px; bottom: 38px; display: flex; justify-content: space-between">
        <span style="width: 50px; height: 50px; border-radius: 25px; background: rgba(28,32,38,0.7)"></span>
        <span style="width: 50px; height: 50px; border-radius: 25px; background: rgba(28,32,38,0.7)"></span>
      </div>
    </div>
  </sc-if>
  <div aria-hidden="true" style="position: absolute; left: 50%; bottom: 4px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #EDEFF2"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"enum","options":["admin","kid"],"default":"admin"},"now":{"editor":"enum","options":["afternoon","evening"],"default":"afternoon"},"view":{"editor":"enum","options":["home","lock"],"default":"home"},"$preview":{"width":390,"height":844}}'>
// Generated from prototypes/megasprite (mega-template.mjs, pixel-paint.mjs, export-looks.mjs).
__SPRITE_LIVE__
__FAMILY_DATA__

// Each viewer's widgets show their own MEGA and only the events that involve them.
const VIEWERS = {
  admin: { mega: 'Teal', hex: '#2FB8B0', face: 'open', sees: ['You', 'Twins', 'Family'] },
  kid: { mega: 'Zap', hex: '#8E6CE0', face: 'happy', sees: ['Twins', 'Family'], kid: true },
};
// What the MEGA would say next when nothing is coming up: the top-scored proactive statement
// that the judge didn't think was worth a push. Samples only.
const STATEMENTS = {
  admin: { text: 'Recycling goes out Tuesday. Want a reminder Monday night?', short: 'Recycling goes out Tuesday' },
  kid: { text: 'Reading time is done. Want to pick a book for tomorrow?', short: 'Pick a book for tomorrow?' },
};
const ICONS = ['#3A4150', '#4B3A50', '#2F4A45', '#50473A', '#3A4A5A', '#45503A', '#503A3F', '#3A3F50', '#4A4A4A', '#2F3A4A', '#4A3A2F'];

class Component extends DCLogic {
  renderVals() {
    const v = VIEWERS[this.props.who] ?? VIEWERS.admin, nowKey = this.props.now === 'evening' ? 'evening' : 'afternoon', now = NOW[nowKey];
    const { dark } = shades(v.hex), accent = v.hex;
    // Priority: anything in the next 2 hours, otherwise the MEGA's proactive statement.
    const soon = WEEK[0].events.filter(([t, , who]) => v.sees.includes(who) && t >= now && t - now <= SOON_WINDOW)
      .map(([t, title, who]) => ({ time: clock(t), until: inMinutes(t - now), title, who: who === 'You' && v.kid ? 'Family' : who, color: WHO[who] }));
    const statement = STATEMENTS[this.props.who] ?? STATEMENTS.admin, next = soon[0];
    const time = clock(now).replace(/ (AM|PM)$/, '');
    return {
      wallpaper: 'linear-gradient(165deg, ' + dark + ' 0%, #12151A 55%, #0C0E11 100%)',
      isHome: this.props.view !== 'lock', isLock: this.props.view === 'lock', time, mega: v.mega,
      accent, accentInk: inkOn(accent),
      head: sprite(v.hex, v.face, 'none', 1.5, 27), tinyHead: sprite(v.hex, v.face, 'none', 0.8125, 27),
      hasSoon: soon.length > 0, noSoon: soon.length === 0, soon: soon.slice(0, 3), statement,
      mediumTitle: soon.length ? 'Coming up · next 2 hours' : v.mega + ' says',
      mediumLabel: soon.length ? 'Coming up: ' + soon.map((e) => e.title + ' ' + e.until).join(', ') : v.mega + ' says: ' + statement.text,
      // Tapping a widget opens the chat; the Talk button opens talk mode already listening.
      tapHref: v.kid ? 'Kid.dc.html' : 'Main.dc.html',
      smallBg: accent, smallInk: inkOn(accent), smallFont: v.kid ? 19 : 17,
      smallTag: next ? next.until.replace('in ', '') : 'Tip',
      smallLine: next ? next.title : statement.short,
      inline: WEEK[0].dow + ' ' + WEEK[0].num + (next ? ' · ' + next.title + ' ' + next.time : ''),
      lockKicker: next ? next.time + ' · ' + next.until : v.mega + ' says',
      lockLine: next ? next.title : statement.short,
      iconsA: ICONS.slice(0, 4), iconsB: ICONS.slice(4, 7), dock: ICONS.slice(7, 11),
    };
  }
}
</script>
</body>
</html>
