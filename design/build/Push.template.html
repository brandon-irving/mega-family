<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Push notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E11}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #EDEFF2; background: {{wallpaper}}">

  <sc-if value="{{onLock}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: stretch">
      <div style="display: flex; flex-direction: column; align-items: center; padding-top: 58px; gap: 2px; flex-shrink: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EDEFF2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <div style="font-size: 17px; font-weight: 600; margin-top: 6px">{{date}}</div>
        <div style="font-size: 86px; font-weight: 700; line-height: 92px; letter-spacing: -2px">{{time}}</div>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 0 10px 118px; min-height: 0">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
          <section aria-label="{{c.label}}" style="position: relative; z-index: {{c.z}}; opacity: {{c.opacity}}; background: rgba(28,32,38,0.86); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.35)">
            <sc-if value="{{c.open}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{c.expand}}" aria-expanded="{{c.expandedStr}}" style="display: flex; gap: 10px; align-items: flex-start; padding: 0; border: none; background: transparent; color: #EDEFF2; text-align: left">
                <span style="position: relative; width: 40px; height: 34px; flex-shrink: 0; border-radius: 9px; overflow: hidden; background: #FFFFFF">
                  <sc-for list="{{c.head.rects}}" as="r" hint-placeholder-count="150">
                    <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
                  </sc-for>
                </span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span style="display: flex; gap: 8px; font-size: 13px; color: #B4BAC3"><span style="flex: 1; font-weight: 600; color: {{c.kindColor}}">{{c.from}}</span><span>{{c.when}}</span></span>
                  <span style="font-size: 16px; font-weight: 600; line-height: 21px">{{c.title}}</span>
                  <span style="font-size: 14px; line-height: 19px; color: #C9CED6">{{c.body}}</span>
                  <sc-if value="{{c.hasHeld}}" hint-placeholder-val="{{ false }}">
                    <span style="font-size: 12px; color: #9AA1AB; display: flex; align-items: center; gap: 5px; margin-top: 2px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>{{c.held}}</span>
                  </sc-if>
                </span>
              </button>
              <sc-if value="{{c.expanded}}" hint-placeholder-val="{{ false }}">
                <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                  <sc-for list="{{c.actions}}" as="a" hint-placeholder-count="2">
                    <button type="button" onClick="{{a.pick}}" style="height: {{c.btnH}}px; border-radius: 14px; border: none; background: {{a.bg}}; color: {{a.fg}}; font-size: {{c.btnFont}}px; font-weight: 600">{{a.label}}</button>
                  </sc-for>
                </div>
                <button type="button" onClick="{{c.openApp}}" style="height: 40px; border-radius: 14px; border: 1px solid #3A414B; background: transparent; color: #EDEFF2; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px">Open chat with {{mega}}<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
              </sc-if>
            </sc-if>
            <sc-if value="{{c.isDone}}" hint-placeholder-val="{{ false }}">
              <div role="status" style="display: flex; align-items: center; gap: 10px">
                <span style="width: 28px; height: 28px; border-radius: 14px; background: {{c.megaHex}}; color: #04201E; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
                <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
                  <span style="font-size: 13px; color: #9AA1AB">You answered “{{c.answer}}”</span>
                  <span style="font-size: 15px; line-height: 20px"><b>{{mega}}:</b> {{c.reply}}</span>
                </span>
              </div>
            </sc-if>
          </section>
        </sc-for>

        <sc-if value="{{hasQuiet}}" hint-placeholder-val="{{ true }}">
          <sc-if value="{{quietClosed}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{openQuiet}}" aria-label="Show {{quietCount}} quiet updates" style="position: relative; opacity: {{quietOpacity}}; margin-bottom: 10px; border: none; padding: 0; background: transparent; color: #EDEFF2; text-align: left">
              <span aria-hidden="true" style="position: absolute; left: 16px; right: 16px; bottom: -10px; height: 20px; border-radius: 0 0 18px 18px; background: rgba(28,32,38,0.55)"></span>
              <span style="position: relative; display: flex; align-items: center; gap: 10px; background: rgba(28,32,38,0.72); border-radius: 22px; padding: 12px">
                <span style="width: 40px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; color: #9AA1AB; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M3 3l18 18"></path></svg></span>
                <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 15px; font-weight: 600">{{quietCount}} quiet updates from {{mega}}</span>
                  <span style="font-size: 13px; color: #9AA1AB">Delivered without sound</span>
                </span>
              </span>
            </button>
          </sc-if>
          <sc-if value="{{quietOpen}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; align-items: center; padding: 0 6px">
                <span style="flex: 1; font-size: 13px; font-weight: 600; color: #C9CED6">Quiet · no sound</span>
                <button type="button" onClick="{{closeQuiet}}" style="height: 30px; padding: 0 12px; border-radius: 15px; border: none; background: rgba(28,32,38,0.86); color: #EDEFF2; font-size: 13px">Show less</button>
              </div>
              <sc-for list="{{quiet}}" as="q" hint-placeholder-count="2">
                <div style="display: flex; gap: 10px; background: rgba(28,32,38,0.72); border-radius: 18px; padding: 11px 12px">
                  <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                    <span style="display: flex; gap: 8px; font-size: 12px; color: #9AA1AB"><span style="flex: 1; font-weight: 600">{{mega}} · {{q.kind}}</span><span>{{q.when}}</span></span>
                    <span style="font-size: 15px; font-weight: 600">{{q.title}}</span>
                    <span style="font-size: 13px; color: #B4BAC3">{{q.body}}</span>
                  </span>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </sc-if>
      </div>

      <sc-if value="{{dimmed}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{collapse}}" aria-label="Close" style="position: absolute; inset: 0; z-index: 1; border: none; background: rgba(6,7,9,0.55)"></button>
      </sc-if>
      <div aria-hidden="true" style="position: absolute; left: 44px; right: 44px; bottom: 38px; display: flex; justify-content: space-between">
        <span style="width: 50px; height: 50px; border-radius: 25px; background: rgba(28,32,38,0.7)"></span>
        <span style="width: 50px; height: 50px; border-radius: 25px; background: rgba(28,32,38,0.7)"></span>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 50%; bottom: 10px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #EDEFF2"></div>
    </div>
  </sc-if>

  <sc-if value="{{inApp}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: #0C0E11; display: flex; flex-direction: column">
      <header style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid #22262D; flex-shrink: 0">
        <span style="position: relative; width: 48px; height: 41px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #FFFFFF">
          <sc-for list="{{appHead.rects}}" as="r" hint-placeholder-count="150">
            <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
          </sc-for>
        </span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <div style="font-size: 18px; font-weight: 600">{{mega}}</div>
          <div style="font-size: 13px; color: #9AA1AB">Your MEGA</div>
        </div>
      </header>
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 16px; min-height: 0">
        <div style="align-self: center; font-size: 12px; color: #9AA1AB; background: #16191E; border: 1px solid #22262D; padding: 5px 11px; border-radius: 12px; display: flex; align-items: center; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg>From a notification · {{appCard.when}}</div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 12px; font-weight: 600; color: {{appCard.kindColor}}">{{appCard.from}}</div>
          <div style="font-size: {{appFont}}px; line-height: 1.4">{{appCard.say}}</div>
        </div>
        <sc-if value="{{appAsking}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{appCard.actions}}" as="a" hint-placeholder-count="2">
              <button type="button" onClick="{{a.pick}}" style="height: {{appCard.btnH}}px; padding: 0 18px; border-radius: 22px; border: 1px solid {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; font-size: {{appCard.btnFont}}px; font-weight: 600">{{a.label}}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{appAnswered}}" hint-placeholder-val="{{ false }}">
          <div style="align-self: flex-end; max-width: 270px; padding: 10px 15px; border-radius: 18px 18px 4px 18px; background: #123B39; font-size: 16px">{{appCard.answer}}</div>
          <div style="font-size: {{appFont}}px; line-height: 1.4">{{appCard.reply}}</div>
        </sc-if>
      </div>
      <div style="padding: 10px 16px 28px; flex-shrink: 0">
        <div style="height: 48px; border-radius: 24px; border: 1px solid #2E343D; background: #16191E; display: flex; align-items: center; padding: 0 16px; color: #6B727D; font-size: 15px">Message {{mega}}…</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["adult","kid","kidMorning"],"default":"adult"},"at":{"editor":"enum","options":["lock","expanded","handled","quietOpen","opened"],"default":"lock"},"$preview":{"width":390,"height":844}}'>
// Generated from prototypes/megasprite (mega-template.mjs, pixel-paint.mjs, export-looks.mjs).
__SPRITE_LIVE__

// Sample MEGAs and notifications. People are labelled by role only.
const MEGAS = {
  teal: { name: 'Teal', hex: '#2FB8B0', face: 'open' },
  coral: { name: 'Coral', hex: '#F2766B', face: 'happy' },
  zap: { name: 'Zap', hex: '#8E6CE0', face: 'happy' },
};
// Loud kinds wake the phone (iOS time-sensitive / active); quiet kinds arrive with no sound (iOS passive).
const KINDS = { Reminder: '#2FB8B0', Request: '#F2B33D' };
const SCENES = {
  adult: {
    owner: 'teal', date: 'Sunday, October 25', time: '4:40',
    loud: [
      { id: 'milk', kind: 'Request', from: 'coral', when: '2m ago', title: 'Can you grab milk on the way home?',
        body: 'Coral is asking for your partner. Groceries is out of milk.', say: 'Coral is asking for your partner: can you grab milk on the way home? Groceries is out.',
        actions: ['Yes', 'I can’t'], replies: ['Told Coral you’ll grab it. Milk is on your list.', 'Told Coral you can’t. Coral will let your partner know.'] },
      { id: 'pickup', kind: 'Reminder', when: 'now', title: 'Soccer pickup in 10 minutes',
        body: 'Practice ends at 5:30. Leave by 4:50 to beat traffic.', say: 'Soccer pickup in 10 minutes. Practice ends at 5:30, so leave by 4:50 to beat traffic.',
        actions: ['On my way', 'Snooze 5 min'], replies: ['Got it. Drive safe.', 'I’ll remind you again at 4:45.'] },
    ],
    quiet: [
      { kind: 'Kid update', when: '3:58 PM', title: 'Twin finished their math homework', body: 'Zap says it took 25 minutes, with two hints.' },
      { kind: 'Tip', when: '1h ago', title: 'Recycling goes out Tuesday', body: 'Want a reminder Monday night?' },
    ],
  },
  kid: {
    owner: 'zap', kid: true, date: 'Sunday, October 25', time: '3:55',
    loud: [
      { id: 'homework', kind: 'Reminder', when: 'now', title: 'Homework time in 5 minutes', body: 'Math worksheet today. I’ll give hints if you get stuck.',
        say: 'Homework time in 5 minutes! Math worksheet today. I’ll give hints if you get stuck.',
        actions: ['Starting!', '5 more min'], replies: ['Nice! See you at your desk.', 'OK, I’ll check back at 4:05.'] },
    ],
    quiet: [],
  },
  kidMorning: {
    owner: 'zap', kid: true, date: 'Monday, October 26', time: '7:00',
    loud: [
      { id: 'book', kind: 'Reminder', when: '7:00 AM', held: 'Saved from 9:10 PM · quiet hours', title: 'Bring your library book today', body: 'It goes back to school today.',
        say: 'Good morning! Bring your library book today. It goes back to school today.',
        actions: ['Got it', 'Remind me at 7:30'], replies: ['Great. Have a good day!', 'OK, I’ll remind you at 7:30.'] },
    ],
    quiet: [],
  },
};
// Kids get bigger targets, same as thread UI blocks.
const SIZES = { adult: { btnH: 44, btnFont: 15, appFont: 17 }, kid: { btnH: 54, btnFont: 18, appFont: 20 } };
const badge = (id, scale) => sprite(MEGAS[id].hex, MEGAS[id].face, 'none', scale, 27);

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const s = SCENES[props.scene] ?? SCENES.adult, first = s.loud[0].id, at = props.at;
    this.state = {
      expanded: at === 'expanded' ? first : null,
      answers: at === 'handled' ? { [first]: 0 } : {},
      quietOpen: at === 'quietOpen',
      openId: at === 'opened' ? first : null,
    };
  }
  renderVals() {
    const s = SCENES[this.props.scene] ?? SCENES.adult;
    const { expanded, answers, quietOpen, openId } = this.state;
    const owner = MEGAS[s.owner], size = s.kid ? SIZES.kid : SIZES.adult, { dark } = shades(owner.hex);
    const answer = (id, i) => this.setState({ answers: { ...answers, [id]: i }, expanded: null });
    const card = (n) => {
      const done = answers[n.id] !== undefined, from = n.from ? MEGAS[n.from].name : owner.name;
      return {
        label: owner.name + ' ' + n.kind.toLowerCase(), from: owner.name + ' · ' + (n.from ? n.kind + ' from ' + from : n.kind), kindColor: KINDS[n.kind],
        when: n.when, title: n.title, body: n.body, say: n.say, hasHeld: !!n.held, held: n.held || '',
        head: badge(n.from ?? s.owner, 1.25), megaHex: owner.hex,
        open: !done, isDone: done, answer: done ? n.actions[answers[n.id]] : '', reply: done ? n.replies[answers[n.id]] : '',
        expanded: expanded === n.id, expandedStr: expanded === n.id ? 'true' : 'false',
        z: expanded === n.id ? 2 : 0, opacity: expanded && expanded !== n.id ? 0.35 : 1,
        btnH: size.btnH, btnFont: size.btnFont,
        actions: n.actions.map((label, i) => ({ label, bg: i === 0 ? owner.hex : 'rgba(255,255,255,0.1)', fg: i === 0 ? inkOn(owner.hex) : '#EDEFF2', border: i === 0 ? owner.hex : '#3A414B', pick: () => answer(n.id, i) })),
        expand: () => this.setState({ expanded: expanded === n.id ? null : n.id }),
        openApp: () => this.setState({ openId: n.id, expanded: null }),
      };
    };
    const cards = s.loud.map(card);
    const appIdx = s.loud.findIndex((n) => n.id === openId), appCard = appIdx >= 0 ? cards[appIdx] : cards[0];
    return {
      wallpaper: 'linear-gradient(165deg, ' + dark + ' 0%, #12151A 55%, #0C0E11 100%)',
      date: s.date, time: s.time, mega: owner.name,
      onLock: !openId, inApp: !!openId, cards, dimmed: !!expanded, collapse: () => this.setState({ expanded: null }),
      hasQuiet: s.quiet.length > 0, quietCount: s.quiet.length, quiet: s.quiet,
      quietClosed: !quietOpen, quietOpen, quietOpacity: expanded ? 0.35 : 1,
      openQuiet: () => this.setState({ quietOpen: true }), closeQuiet: () => this.setState({ quietOpen: false }),
      appHead: badge(s.owner, 1.5), appCard, appFont: size.appFont, appAsking: appCard.open, appAnswered: appCard.isDone,
    };
  }
}
</script>
</body>
</html>
