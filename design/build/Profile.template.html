<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MEGA profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0E11}
a{color:#EDEFF2;text-decoration:none}
button,input,select,textarea{font-family:inherit}
@keyframes cheer{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.06)}70%{transform:translateY(0) scale(.97)}100%{transform:translateY(0) scale(1)}}
.cheer{animation:cheer .6s ease-in-out 2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0C0E11; color: #EDEFF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <sc-if value="{{onProfile}}" hint-placeholder-val="{{ true }}">
    <header style="display: flex; align-items: center; height: 56px; padding: 0 8px; flex-shrink: 0">
      <a href="{{closeHref}}" aria-label="Close profile" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </header>
    <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 0 16px 24px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="width: 240px; height: 176px; border-radius: 24px; background: {{stageBg}}; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; box-sizing: border-box">
          <div class="{{heroClass}}" style="position: relative; width: 128px; height: 160px">
            <sc-for list="{{hero.rects}}" as="r" hint-placeholder-count="240">
              <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
            </sc-for>
            <sc-if value="{{hero.hasSticker}}" hint-placeholder-val="{{ true }}">
              <img src="{{hero.sticker}}" alt="" style="position: absolute; inset: 0; width: 128px; height: 160px; image-rendering: pixelated">
            </sc-if>
          </div>
        </div>
        <sc-if value="{{notRenaming}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 6px">
            <h1 style="margin: 0; font-size: 28px; font-weight: 800">{{name}}</h1>
            <sc-if value="{{canRename}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{startRename}}" aria-label="Rename {{name}}" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: transparent; color: #9AA1AB; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{renaming}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 8px; width: 100%">
            <label for="mega-name" style="position: absolute; left: -9999px">Name</label>
            <input id="mega-name" type="text" value="{{draftName}}" onInput="{{typeName}}" style="flex: 1; height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid #2E343D; background: #16191E; color: #EDEFF2; padding: 0 14px; font-size: 18px; font-weight: 700">
            <button type="button" onClick="{{saveName}}" style="height: 48px; padding: 0 18px; border-radius: 24px; border: none; background: {{accent}}; color: {{accentInk}}; font-size: 15px; font-weight: 700">Save</button>
          </div>
        </sc-if>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9AA1AB">
          <span style="width: 7px; height: 7px; border-radius: 4px; background: {{accent}}"></span>{{status}}
        </div>
      </div>

      <button type="button" onClick="{{openStyle}}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 14px; border-radius: 18px; border: 1px solid #2A3038; background: #16191E; color: #EDEFF2; text-align: left">
        <span style="position: relative; width: 48px; height: 40px; overflow: hidden; flex-shrink: 0; border-radius: 10px; background: #FFFFFF">
          <sc-for list="{{thumb.rects}}" as="r" hint-placeholder-count="200">
            <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
          </sc-for>
          <sc-if value="{{thumb.hasSticker}}" hint-placeholder-val="{{ true }}">
            <img src="{{thumb.sticker}}" alt="" style="position: absolute; left: 0; top: 0; width: 48px; height: 60px; image-rendering: pixelated">
          </sc-if>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex: 1">
          <span style="font-size: 17px; font-weight: 700">{{styleTitle}}</span>
          <span style="font-size: 14px; color: #9AA1AB">{{styleSummary}}</span>
        </span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA1AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>

      <sc-if value="{{showShares}}" hint-placeholder-val="{{ true }}">
        <section style="display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #9AA1AB; letter-spacing: .04em; text-transform: uppercase">What {{name}} shares</h2>
          <sc-for list="{{shares}}" as="s" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #22262D">
              <label for="{{s.id}}" style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 500">{{s.label}}</span>
                <span style="font-size: 13px; color: #8A919B">{{s.hint}}</span>
              </label>
              <select id="{{s.id}}" style="height: 40px; border-radius: 12px; border: 1px solid #2E343D; background: #16191E; color: #EDEFF2; padding: 0 10px; font-size: 15px">
                <sc-for list="{{s.options}}" as="o" hint-placeholder-count="3">
                  <option value="{{o.value}}" selected="{{o.selected}}">{{o.value}}</option>
                </sc-for>
              </select>
            </div>
          </sc-for>
        </section>
      </sc-if>

      <sc-if value="{{showAdmin}}" hint-placeholder-val="{{ true }}">
        <section style="display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #9AA1AB; letter-spacing: .04em; text-transform: uppercase">Admin</h2>
          <sc-for list="{{adminRows}}" as="r" hint-placeholder-count="3">
            <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0; border: none; border-bottom: 1px solid #22262D; background: transparent; color: #EDEFF2; text-align: left">
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 500">{{r.label}}</span>
                <span style="font-size: 13px; color: #8A919B">{{r.hint}}</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA1AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
          </sc-for>
        </section>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{onStyle}}" hint-placeholder-val="{{ false }}">
    <header style="display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; height: 56px; padding: 0 8px; flex-shrink: 0">
      <button type="button" onClick="{{backToProfile}}" aria-label="Back to profile" style="width: 44px; height: 44px; border: none; background: transparent; color: #EDEFF2; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <h1 style="margin: 0; text-align: center; font-size: 17px; font-weight: 700">{{styleTitle}}</h1>
      <button type="button" onClick="{{backToProfile}}" style="justify-self: end; height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: {{accent}}; color: {{accentInk}}; font-size: 15px; font-weight: 700">Done</button>
    </header>
    <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 4px 16px 24px">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 176px; padding: 12px 14px; border-radius: 24px; background: {{stageBg}}; box-sizing: border-box">
        <div class="{{heroClass}}" style="position: relative; width: {{preview.w}}px; height: {{preview.h}}px; flex-shrink: 0">
          <sc-for list="{{preview.rects}}" as="r" hint-placeholder-count="240">
            <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
          </sc-for>
          <sc-if value="{{preview.hasSticker}}" hint-placeholder-val="{{ true }}">
            <img src="{{preview.sticker}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated">
          </sc-if>
        </div>
        <sc-if value="{{showPersonality}}" hint-placeholder-val="{{ true }}">
          <div style="flex: 1; border: 3px solid #1B1A3A; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #B9C3E0; padding: 10px 12px; color: #1B1A3A; font-family: 'Pixelify Sans', monospace; font-size: 16px; line-height: 21px">{{sample}}</div>
        </sc-if>
      </div>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #9AA1AB; letter-spacing: .04em; text-transform: uppercase">Color</h2>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{colors}}" as="c" hint-placeholder-count="6">
            <button type="button" aria-label="{{c.label}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: {{swatch}}px; border-radius: 50%; border: {{c.ring}}; background: {{c.hex}}; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25)"></button>
          </sc-for>
          <button type="button" aria-label="Custom color" aria-expanded="{{customOpenStr}}" onClick="{{toggleCustom}}" style="height: {{swatch}}px; border-radius: 50%; border: {{customRing}}; background: conic-gradient(#F2766B, #F2B33D, #5BBF6A, #2FB8B0, #5B8DEF, #8E6CE0, #F2766B); display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
        <sc-if value="{{customOpen}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 16px; background: #16191E; border: 1px solid #2A3038">
            <label for="custom-color" style="position: absolute; left: -9999px">Pick a color</label>
            <input id="custom-color" type="color" value="{{hex}}" onInput="{{pickCustom}}" style="width: 52px; height: 44px; padding: 0; border: none; border-radius: 10px; background: transparent">
            <label for="custom-hex" style="font-size: 14px; color: #9AA1AB">Hex</label>
            <input id="custom-hex" type="text" value="{{draftHex}}" onInput="{{typeHex}}" maxlength="7" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{hexBorder}}; background: #0C0E11; color: #EDEFF2; padding: 0 12px; font-size: 16px; font-family: ui-monospace, monospace; text-transform: uppercase">
          </div>
        </sc-if>
      </section>

      <section style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #9AA1AB; letter-spacing: .04em; text-transform: uppercase">Sticker</h2>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{stickers}}" as="d" hint-placeholder-count="5">
            <button type="button" aria-label="{{d.label}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="position: relative; height: {{swatch}}px; border-radius: 14px; border: {{d.ring}}; background: #16191E; color: #EDEFF2; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">
              <sc-if value="{{d.hasImage}}" hint-placeholder-val="{{ true }}">
                <span aria-hidden="true" style="position: relative; width: 36px; height: 36px; overflow: hidden">
                  <img src="{{d.src}}" alt="" style="position: absolute; left: -60px; top: -9px; width: 96px; height: 120px; image-rendering: pixelated">
                </span>
              </sc-if>
              <sc-if value="{{d.isNone}}" hint-placeholder-val="{{ false }}">None</sc-if>
            </button>
          </sc-for>
        </div>
      </section>

      <sc-if value="{{showPersonality}}" hint-placeholder-val="{{ true }}">
        <section style="display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #9AA1AB; letter-spacing: .04em; text-transform: uppercase">Personality</h2>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{personalities}}" as="p" hint-placeholder-count="4">
              <button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 76px; padding: 10px; border-radius: 16px; border: {{p.ring}}; background: #16191E; color: #EDEFF2; text-align: left">
                <span style="position: relative; width: 48px; height: 40px; overflow: hidden; flex-shrink: 0; border-radius: 10px; background: #FFFFFF">
                  <sc-for list="{{p.face.rects}}" as="r" hint-placeholder-count="200">
                    <span style="position: absolute; left: {{r.l}}px; top: {{r.t}}px; width: {{r.w}}px; height: {{r.h}}px; background: {{r.c}}"></span>
                  </sc-for>
                </span>
                <span style="display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 16px; font-weight: 700">{{p.label}}</span>
                  <span style="font-size: 12px; line-height: 16px; color: #9AA1AB">{{p.blurb}}</span>
                </span>
              </button>
            </sc-for>
          </div>
        </section>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"level":{"editor":"enum","options":["admin","adult","kid"],"default":"admin"},"start":{"editor":"enum","options":["profile","style"],"default":"profile"},"$preview":{"width":390,"height":844}}'>
// Generated from prototypes/megasprite (mega-template.mjs, pixel-paint.mjs, export-looks.mjs).
// The MEGA is drawn live from the template's pixel data, so any hex colour works.
__LOOKS_DATA__
const COLOR_LABELS = { teal: 'Teal', coral: 'Coral', violet: 'Violet', sun: 'Sun', sky: 'Sky', leaf: 'Leaf' };
const STICKER_LABELS = { star: 'Star', heart: 'Heart', leaf: 'Leaf', bolt: 'Bolt', none: 'No sticker' };
const BLINK_EVERY = 3400, BLINK_FOR = 150;
const HEX = /^#[0-9a-fA-F]{6}$/;

// Who is looking, by level. Config in the app; sample members here.
const MEMBERS = {
  admin: { name: 'Teal', hex: '#2FB8B0', sticker: 'star', personality: 'brief', status: 'At the desk · Math homework', close: 'Main.dc.html' },
  adult: { name: 'Coral', hex: '#F2766B', sticker: 'heart', personality: 'cheerful', status: 'At the calendar', close: 'Main.dc.html' },
  kid: { name: 'Zap', hex: '#8E6CE0', sticker: 'bolt', personality: 'cheerful', status: 'Ready to play', close: 'Kid.dc.html' },
};

__SPRITE_LIVE__
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const m = MEMBERS[props.level] || MEMBERS.admin;
    this.state = { screen: props.start === 'style' ? 'style' : 'profile', name: m.name, draftName: m.name, renaming: false, hex: m.hex, draftHex: m.hex, customOpen: false, sticker: m.sticker, personality: m.personality, cheerAt: 0, blinking: false };
  }
  componentDidMount() {
    this.blinkTimer = setInterval(() => {
      this.setState({ blinking: true });
      this.unblink = setTimeout(() => this.setState({ blinking: false }), BLINK_FOR);
    }, BLINK_EVERY);
  }
  componentWillUnmount() { clearInterval(this.blinkTimer); clearTimeout(this.unblink); clearTimeout(this.cheerTimer); }

  // Kids get a happy bounce whenever they change the look.
  cheer() {
    if ((this.props.level || 'admin') !== 'kid') return;
    clearTimeout(this.cheerTimer);
    this.setState({ cheerAt: Date.now() });
    this.cheerTimer = setTimeout(() => this.setState({ cheerAt: 0 }), 1300);
  }
  setHex(hex) { this.setState({ hex: hex.toUpperCase(), draftHex: hex.toUpperCase() }); this.cheer(); }

  renderVals() {
    const level = this.props.level || 'admin', m = MEMBERS[level] || MEMBERS.admin;
    const { screen, name, draftName, renaming, hex, draftHex, customOpen, sticker, personality, cheerAt, blinking } = this.state;
    const isKid = level === 'kid', accent = hex, presetHexes = Object.values(LOOKS.colors).map((c) => c.toUpperCase());
    const resting = LOOKS.personalities[personality].face;
    const face = cheerAt ? 'happy' : blinking ? 'closed' : resting;
    const ring = (on) => (on ? '3px solid ' + accent : '3px solid transparent');
    const isCustom = !presetHexes.includes(hex.toUpperCase());
    const presetName = Object.keys(LOOKS.colors).find((id) => LOOKS.colors[id].toUpperCase() === hex.toUpperCase());

    return {
      onProfile: screen === 'profile', onStyle: screen === 'style',
      closeHref: m.close, name, status: m.status, accent, accentInk: inkOn(accent),
      stageBg: accent + '22',
      heroClass: cheerAt ? 'cheer' : '',
      hero: sprite(hex, face, sticker, 4),
      thumb: sprite(hex, face, sticker, 1.5, 27),
      preview: sprite(hex, face, sticker, isKid ? 4.5 : 3.5),
      canRename: !isKid, notRenaming: !renaming, renaming, draftName,
      startRename: () => this.setState({ renaming: true, draftName: name }),
      typeName: (e) => this.setState({ draftName: e.target.value }),
      saveName: () => this.setState({ renaming: false, name: draftName.trim() || name }),
      styleTitle: isKid ? 'Change look' : 'Look and personality',
      styleSummary: (presetName ? COLOR_LABELS[presetName] : hex) + ' · ' + STICKER_LABELS[sticker] + ' · ' + LOOKS.personalities[personality].label,
      openStyle: () => this.setState({ screen: 'style' }),
      backToProfile: () => this.setState({ screen: 'profile' }),
      showShares: !isKid, showAdmin: level === 'admin',
      shares: [
        { id: 'share-schedule', label: 'Schedule', hint: 'Events and reminders', value: 'Family' },
        { id: 'share-lists', label: 'Lists', hint: 'Groceries, chores, packing', value: 'Family' },
        { id: 'share-hq', label: 'What ' + name + ' is doing in HQ', hint: 'Others see "Busy" when off', value: 'Only me' },
      ].map((s) => ({ ...s, options: ['Only me', 'Partner', 'Family'].map((v) => ({ value: v, selected: v === s.value })) })),
      adminRows: [
        { label: 'What ' + name + ' remembers', hint: '24 things · search and delete' },
        { label: 'Rules and limits', hint: 'Quiet hours 9 PM–7 AM · 6 pushes a day' },
        { label: 'Activity', hint: 'What ' + name + ' did and when' },
      ],
      swatch: isKid ? 52 : 44,
      showPersonality: true,
      sample: LOOKS.personalities[personality].sample,
      colors: Object.keys(LOOKS.colors).map((id) => {
        const on = LOOKS.colors[id].toUpperCase() === hex.toUpperCase();
        return { hex: LOOKS.colors[id], label: COLOR_LABELS[id], on: on ? 'true' : 'false', ring: on ? '3px solid #FFFFFF' : '3px solid transparent', pick: () => this.setHex(LOOKS.colors[id]) };
      }),
      customOpen, customOpenStr: customOpen ? 'true' : 'false', customRing: isCustom ? '3px solid #FFFFFF' : '3px solid transparent',
      toggleCustom: () => this.setState({ customOpen: !customOpen, draftHex: hex }),
      hex, draftHex, hexBorder: HEX.test(draftHex) ? '#2E343D' : '#F2766B',
      pickCustom: (e) => this.setHex(e.target.value),
      typeHex: (e) => {
        let v = e.target.value.trim();
        if (v && v[0] !== '#') v = '#' + v;
        if (HEX.test(v)) this.setHex(v); else this.setState({ draftHex: v });
      },
      stickers: [...LOOKS.stickers, 'none'].map((id) => ({
        label: STICKER_LABELS[id], on: id === sticker ? 'true' : 'false', ring: ring(id === sticker),
        hasImage: id !== 'none', isNone: id === 'none', src: id === 'none' ? '' : '/_blob/' + STICKER_ART[id],
        pick: () => { this.setState({ sticker: id }); this.cheer(); },
      })),
      personalities: Object.keys(LOOKS.personalities).map((id) => {
        const p = LOOKS.personalities[id];
        return { label: p.label, blurb: p.blurb, on: id === personality ? 'true' : 'false', ring: ring(id === personality), face: sprite(hex, p.face, 'none', 1.5, 27), pick: () => { this.setState({ personality: id }); this.cheer(); } };
      }),
    };
  }
}
</script>
</body>
</html>
